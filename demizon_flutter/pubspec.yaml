name: demizon
description: Mobilní klient pro folklorní soubor Demizon (přepis z .NET MAUI).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Stav a DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Sit + typovany API klient (nahrazuje Refit)
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0

  # Ulozeni (nahrazuje SecureStorage / Preferences)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Push + lokalni notifikace
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1

  # Soubory a odkazy
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  url_launcher: ^6.3.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  retrofit_generator: ^9.1.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
